spring.datasource.url=jdbc:mysql://localhost:3306/food_app?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

server.port=8080
spring.main.allow-circular-references=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
app.base-url=http://localhost:8080

# Gemini
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.base-url=https://generativelanguage.googleapis.com
app.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

server.error.include-message=always